# 复制为 secret.yaml 并填写；不要提交真实密钥。也可改用 External Secrets / 云厂商密钥管理。
apiVersion: v1
kind: Secret
metadata:
  name: reviewdesk-secrets
  namespace: reviewdesk
type: Opaque
stringData:
  REVIEWDESK_DATABASE_URL: postgresql+psycopg://USER:PASSWORD@managed-postgres-host:5432/reviewdesk
  REVIEWDESK_S3_ENDPOINT: https://s3.ap-southeast-1.amazonaws.com
  REVIEWDESK_S3_ACCESS_KEY: ""
  REVIEWDESK_S3_SECRET_KEY: ""
  REVIEWDESK_SECRET_KEY: ""            # openssl rand -hex 32
  REVIEWDESK_BOOTSTRAP_ADMIN_EMAIL: admin@example.edu
  REVIEWDESK_BOOTSTRAP_ADMIN_PASSWORD: ""
  REVIEWDESK_OPENAI_API_KEY: ""
  REVIEWDESK_NCBI_API_KEY: ""
  REVIEWDESK_NCBI_EMAIL: ""
  REVIEWDESK_OPENALEX_API_KEY: ""
