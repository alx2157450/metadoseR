[project]
name = "reviewdesk"
version = "0.1.0"
description = "综述协作平台：人机协同撰写高水平医学综述（本地 / 课题组服务器 / 云端部署）"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy>=2.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "pyjwt>=2.7",
  "pyyaml>=6",
  "cryptography>=41",
]

[project.optional-dependencies]
server = ["psycopg[binary]>=3.1", "boto3>=1.34"]
dev = ["pytest>=8"]

[project.scripts]
reviewdesk = "reviewdesk.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["reviewdesk*"]

[tool.setuptools.package-data]
reviewdesk = ["prompts/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
